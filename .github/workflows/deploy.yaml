name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to deploy to
        required: true
        type: environment
        default: staging
      infra_branch:
        description: The branch of the infrastructure repository to deploy
        required: true
        type: string
        default: main
  workflow_call:
    inputs:
      environment:
        description: The environment to deploy to
        required: true
        type: string
        default: staging
      infra_branch:
        description: The branch of the infrastructure repository to deploy
        required: true
        type: string
        default: main
    secrets:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      DEPLOYMENT_APP_ID:
      DEPLOYMENT_APP_KEY:
      # Required: the Dockerfile's base image is a Docker Hardened Image, so the
      # build cannot pull it without these. Forwarded to the shared build workflow
      # as REGISTRY_USERNAME/REGISTRY_PASSWORD. Marked required so a caller that
      # forgets to pass them fails with that message, rather than at an anonymous
      # docker login and then a confusing failure on the first FROM.
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_READONLY_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  ci:
    name: Verify code is valid
    permissions:
      checks: write
      contents: write
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push image
    needs: ci
    permissions:
      contents: read
      id-token: write
    uses: codeforamerica/github-actions/.github/workflows/ecr-build-push.yaml@main
    with:
      ecr-repository: work-requirements-self-advocacy-tool-${{ inputs.environment }}-web
      image-tag: ${{ github.sha }}
      environment: ${{ inputs.environment }}
      fail-on-existing-tag: false
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      REGISTRY_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_READONLY_TOKEN }}

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: build
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      IMAGE_TAG: ${{ github.sha }}
      INFRA_REPO: work-requirements-self-advocacy-tool-infra

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Update SSM Version Parameter
        run: |
          echo "tag:$IMAGE_TAG"
          aws ssm put-parameter \
            --name  /work-requirements-self-advocacy-tool/$ENVIRONMENT/web/version \
            --value "$IMAGE_TAG" \
            --overwrite
      - name: Get a deployment token
        uses: actions/create-github-app-token@v3.3.0
        id: token
        with:
          app-id: ${{ secrets.DEPLOYMENT_APP_ID }}
          private-key: ${{ secrets.DEPLOYMENT_APP_KEY }}
          owner: codeforamerica
          repositories: ${{ env.INFRA_REPO }}
      - name: Trigger deployment from work requirements self advocacy infra
        uses: codex-/return-dispatch@85e564d60eaec3cc4aca885373d510cfe4bd5b19 # v4
        id: dispatch
        with:
          token: ${{ steps.token.outputs.token }}
          ref: ${{ inputs.infra_branch }}
          repo: ${{ env.INFRA_REPO }}
          owner: codeforamerica
          workflow: 'deploy.yml'
          workflow_inputs: |
            {
              "environment": "${{ env.ENVIRONMENT }}",
              "config": "application"
            }
      - name: Wait on Workflow
        uses: lucasssvaz/wait-on-workflow@676745e30db420704878817812d34d95e20a183d # v1.0.0
        id: waiter
        with:
          github-token: ${{ steps.token.outputs.token }}
          repository: codeforamerica/${{ env.INFRA_REPO }}
          workflow: ${{ steps.dispatch.outputs.run_id }}
      - name: Fail unless the workflow succeeded
        if: ${{ steps.waiter.outputs.conclusion != 'success' }}
        uses: actions/github-script@v9
        with:
          script: |
            core.setFailed('Deployment workflow completed with stats: ${{ steps.waiter.outputs.conclusion }}')
